name: Daily refresh, validate and deploy
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - '.github/workflows/**'
      - 'scanner.py'
      - 'discover.py'
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: airdrop-radar-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh discovery data from public catalogue
        run: python discover.py
      - name: Validate data and expire old opportunities
        run: python scanner.py
      - name: Check HTML and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Check(HTMLParser):
              pass
          html = Path("index.html").read_text(encoding="utf-8")
          Check().feed(html)
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/airdrop-radar.js").write_text(script, encoding="utf-8")
          print("HTML parsed; JavaScript extracted")
          PY
          node --check /tmp/airdrop-radar.js
          #
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
